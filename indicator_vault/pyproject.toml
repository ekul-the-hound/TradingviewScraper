[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indicator-vault"
version = "0.1.0"
description = "Deterministic Pine-to-Python indicator warehousing and similarity system"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26.0",
  "pandas>=2.1.0",
  "duckdb>=1.0.0",
  "pyarrow>=14.0.0"
]

[tool.setuptools]
packages = ["tools"]
package-dir = {"tools" = "tools"}
