[project]
name = "tradingview-indicator-warehouse"
version = "0.1.0"
description = "Deterministic Pine-to-Python indicator warehouse with AST fingerprinting and similarity indexing"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "duckdb>=1.0.0",
  "pyarrow>=16.0.0",
  "annoy>=1.17.3"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["indicator_vault", "indicator_vault.tools"]
