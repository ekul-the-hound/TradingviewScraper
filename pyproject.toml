[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indicator-vault"
version = "0.1.0"
description = "Deterministic Pine-to-Python indicator warehouse and ingestion pipeline"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "duckdb>=1.0.0",
  "pyarrow>=15.0.0",
  "annoy>=1.17.3",
  "networkx>=3.2.0"
]

[tool.setuptools]
packages = ["indicator_vault", "indicator_vault.tools"]

[tool.black]
line-length = 120
